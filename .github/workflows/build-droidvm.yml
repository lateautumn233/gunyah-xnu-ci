name: build-droidvm
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label
        default: macos-26
      unixnu_ref:
        default: wip/droidvm
      device_ref:
        default: wip/hackintosh
      step:
        description: unixnu build step(s)
        default: kernel
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-path; sw_vers; df -h /
      - name: Tools
        run: brew install cmake ninja unifdef llvm lld mtools dtc openssl@3
      - name: Clone UniXNU (Droid-VM) and device repo
        run: |
          git clone --recurse-submodules --branch "${{ inputs.unixnu_ref }}" https://github.com/Droid-VM/UniXNU.git
          git clone --branch "${{ inputs.device_ref }}" https://github.com/Droid-VM/UniXNU-droidvm.git
      - name: Patch bootstrap pass
        run: |
          python3 "$GITHUB_WORKSPACE/patches/bootstrap-skip-checks.py" UniXNU/scripts/build-xnu-4k-baseline.sh
          python3 "$GITHUB_WORKSPACE/patches/github-auth.py" UniXNU/scripts/prepare-xnu-source.py
      - name: Configure
        working-directory: UniXNU
        run: |
          ./unixnu defconfig droidvm_defconfig -D ../UniXNU-droidvm
          ./unixnu fetch
          ./unixnu ipsw fetch
      - name: Build image
        run: bash "$GITHUB_WORKSPACE/patches/droidvm-build.sh"
      - name: Collect
        if: always()
        run: |
          mkdir -p collect
          cp -R UniXNU/out/droidvm/logs collect/ 2>/dev/null || true
          find UniXNU/out/droidvm -maxdepth 3 \( -name 'droidvm-disk.img' -o -name 'kernel.macho' -o -name '*.adt' -o -name '*.log' -o -name '*.json' \) -size -300M 2>/dev/null | head -200 | while read f; do mkdir -p "collect/$(dirname "$f")"; cp "$f" "collect/$f"; done
          gzip -r collect/UniXNU/out 2>/dev/null || true
      - name: Inputs bundle for local (Linux) kernel builds
        if: always()
        run: |
          T=UniXNU/out/droidvm/tree/build
          mkdir -p bundle
          tar czf bundle/droidvm-inputs.tgz -C "$GITHUB_WORKSPACE" \
            UniXNU-droidvm/configs/droidvm_defconfig \
            $(for d in reference-candidate verified-root-os verified-root-systemos verified-root-host droidvm-data droidvm-data-fixture/seed.json original-static-system-trust; do [ -e "$T/$d" ] && echo "UniXNU/out/droidvm/tree/build/$d"; done) 2>&1 | tail -3 || true
          ls -la bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidvm-inputs
          path: bundle
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidvm-${{ inputs.step }}
          path: collect
